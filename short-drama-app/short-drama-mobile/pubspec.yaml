name: drama_now
description: "DramaNow — short drama streaming app."
publish_to: none
version: 1.0.4+4

environment:
  sdk: ^3.6.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter_localizations:
    sdk: flutter
  intl: any
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  sizer: ^2.0.15              # Required for responsive design system
  flutter_svg: ^2.0.9        # Required for SVG icon support
  google_fonts: ^6.1.0       # Required for typography (replaces local fonts)
  shared_preferences: ^2.2.2 # Required for local data storage
  provider: ^6.1.1           # Legacy providers (playback, user, theme)
  flutter_riverpod: ^3.3.2
  web: ^1.1.1
  
  # Feature dependencies - safe to modify
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  crypto: ^3.0.3
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  permission_handler: ^11.3.1
  record: ^6.1.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  lottie: ^3.3.1
  path_provider: ^2.1.2
  just_audio: ^0.9.36
  http: ^1.1.0
  web_socket_channel: ^3.0.3
  
  # Firebase Core (Required)
  firebase_core: ^4.3.0
  firebase_ai: ^3.6.1              # Firebase AI Logic SDK for image generation
  
  # Firebase Services - Phase 1 & 2
  firebase_auth: ^6.1.3              # Authentication (Anonymous + Google)
  firebase_remote_config: ^6.1.3     # Dynamic configuration
  firebase_analytics: ^12.1.0        # User analytics
  facebook_app_events: ^0.24.0       # Meta App Events (mobile pixel equivalent)
  app_tracking_transparency: ^2.0.6  # iOS ATT for Meta ad attribution
  firebase_crashlytics: ^5.0.6       # Crash reporting
  firebase_performance: ^0.11.1+3    # Performance monitoring
  firebase_storage: ^13.0.5          # Cloud storage for photos
  
  # Authentication providers
  sign_in_with_apple: ^6.1.3          # Apple Sign-In
  
  # RevenueCat - Subscription management
  purchases_flutter: ^9.10.1
  video_player: ^2.9.2

  # Round 5 (luxury/UX): keep-screen-on during playback, poster palette
  # extraction, and biometric app lock. All free, on-device only.
  wakelock_plus: ^1.2.10
  palette_generator: ^0.3.3+5
  local_auth: ^2.3.0

  
  universal_html: ^2.2.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  in_app_review: ^2.0.11
  flutter_secure_storage: ^10.0.0
  device_info_plus: ^12.3.0
  uuid: ^4.5.1

  # Cloudflare Turnstile for auth CAPTCHA
  cloudflare_turnstile: ^3.6.2

  # Push notifications
  onesignal_flutter: ^5.2.10
  google_mobile_ads: ^7.0.0
  flutter_local_notifications: ^20.1.0
  media_store_plus: ^0.1.3
  open_filex: ^4.7.0
  share_plus: ^12.0.2
dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^5.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE
  flutter_launcher_icons: ^0.14.4 # For generating app launcher icons

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  generate: true # Enable code generation for l10n
  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/paywall/
    - assets/images/paywall/avatar/
    - assets/avatars/
  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)
  
  
  # Typography: bundled Google Fonts in assets/fonts/ (loaded via google_fonts package).
  # Do not add a flutter/fonts section — google_fonts matches assets by filename.

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
