name: CI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (Node suites 1-8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: short-drama-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run all backend suites (1-8)
        run: |
          set -e
          for suite in test/run-tests.mjs test/run-tests-2.mjs test/run-tests-3.mjs test/run-tests-4.mjs test/run-tests-5.mjs test/run-tests-6.mjs test/run-tests-7.mjs test/run-tests-8.mjs; do
            echo "===== $suite ====="
            node "$suite"
          done

  flutter-checks:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: short-drama-app/short-drama-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
